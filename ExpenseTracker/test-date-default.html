<!DOCTYPE html>
<html lang="en">
<head>
  <title>Test - Date Field Default</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
    crossorigin="anonymous">
  <style>
    body { padding: 50px; }
    .test-result { margin-top: 20px; padding: 15px; border-radius: 5px; }
    .success { background-color: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
    .info { background-color: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Testing Date Field Default Functionality</h1>
    <p class="lead">EPMCDMETST-59424: Default "Date" field to today on Add Expense form</p>

    <hr>

    <h2>Test Form (Simulating Add Expense)</h2>
    <div class="card p-4">
      <form id="expense-form">
        <div class="mb-3">
          <label for="amount" class="form-label">Amount:</label>
          <input type="number" class="form-control" id="amount" name="amount" step="0.01" required>
        </div>

        <div class="mb-3">
          <label for="date" class="form-label">Date:</label>
          <input type="date" class="form-control" id="date" name="date" required pattern="\d{4}-\d{2}-\d{2}">
        </div>

        <div class="mb-3">
          <label for="category" class="form-label">Category:</label>
          <select class="form-select" id="category" name="category" required>
            <option value="">Select a category</option>
            <option value="food">Food</option>
            <option value="transportation">Transportation</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary">Add Expense</button>
      </form>
    </div>

    <div id="test-results"></div>
  </div>

  <!-- The actual JavaScript implementation being tested -->
  <script>
    window.addEventListener('DOMContentLoaded', function() {
      const dateInput = document.getElementById('date');
      const resultsDiv = document.getElementById('test-results');

      // Only set default if date field is empty (Create mode, not Edit mode)
      if (dateInput && !dateInput.value) {
        // Get today's date in yyyy-MM-dd format
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        const formattedDate = `${year}-${month}-${day}`;

        // Set the default value
        dateInput.value = formattedDate;

        // Log for analytics/debugging
        console.log('Default date set to:', formattedDate);

        // Display test results
        const expectedDate = new Date().toISOString().split('T')[0];
        const actualDate = dateInput.value;
        const isCorrect = expectedDate === actualDate;

        resultsDiv.innerHTML = `
          <div class="test-result ${isCorrect ? 'success' : 'danger'}">
            <h3>✓ Test Results</h3>
            <p><strong>Expected Date (Today):</strong> ${expectedDate}</p>
            <p><strong>Actual Date Field Value:</strong> ${actualDate}</p>
            <p><strong>Status:</strong> ${isCorrect ? '✓ PASS - Date field correctly defaulted to today' : '✗ FAIL'}</p>
            <p><strong>Format:</strong> yyyy-MM-dd (${/^\d{4}-\d{2}-\d{2}$/.test(actualDate) ? '✓ Valid' : '✗ Invalid'})</p>
            <p><strong>Field is editable:</strong> ${dateInput.disabled ? '✗ No (should be editable)' : '✓ Yes'}</p>
          </div>

          <div class="test-result info mt-3">
            <h4>Test Scenarios</h4>
            <ul>
              <li>✓ Page loads with empty date field → Date defaults to today</li>
              <li>✓ Date format is yyyy-MM-dd (matches backend expectations)</li>
              <li>✓ User can edit the date field (not readonly)</li>
              <li>✓ JavaScript executes on DOMContentLoaded</li>
            </ul>

            <h4 class="mt-3">To test Edit Mode behavior:</h4>
            <p>Manually set a value in the date field and reload the page. The script should NOT override pre-filled dates.</p>

            <button class="btn btn-sm btn-secondary" onclick="document.getElementById('date').value='2025-01-01'; alert('Date set to 2025-01-01. Now reload the page to test that the script does NOT override this value.')">Simulate Edit Mode</button>
          </div>
        `;
      } else if (dateInput && dateInput.value) {
        resultsDiv.innerHTML = `
          <div class="test-result info">
            <h3>ℹ Edit Mode Detected</h3>
            <p><strong>Date Field Already Has Value:</strong> ${dateInput.value}</p>
            <p><strong>Status:</strong> ✓ PASS - Script correctly did NOT override existing date</p>
            <p>This simulates editing an existing expense where the date should be preserved.</p>
            <button class="btn btn-sm btn-secondary" onclick="location.reload()">Reset Test</button>
          </div>
        `;
      }
    });

    // Prevent actual form submission for demo
    document.getElementById('expense-form').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Form submission prevented (this is a test page)');
    });
  </script>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>
</body>
</html>
