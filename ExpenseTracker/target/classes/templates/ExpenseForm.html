<!-- The form to add any expense for the user -->
  <h1>Expense Form</h1>
  <div class="form-container">
  <form id="expense-form" th:action="@{/save}" method="post">
    <div class="form-group">
      <label for="amount">Amount:</label>
      <input type="number" id="amount" name="amount" step="0.01" required>
      </div>
      <div class="form-group">
      <label for="currency">Currency:</label>
      <select id="currency" name="currency" required>
        <option value="">Select a currency</option>
        <option value="USD">USD</option>
        <option value="INR">INR</option>
        <option value="CAD">CAD</option>
       <option value="YEN">YEN</option>
      </select>
    </div>

    <div class="form-group">
      <label for="date">Date:</label>
      <input type="date" id="date" name="date" required pattern="\d{4}-\d{2}-\d{2}">
    </div>

    <div class="form-group">
      <label for="category">Category:</label>
      <select id="category" name="category" required>
        <option value="">Select a category</option>
        <option value="food">Food</option>
        <option value="transportation">Transportation</option>
        <option value="housing">Housing</option>
        <option value="entertainment">Entertainment</option>
        <option value="entertainment">Shopping</option>
        <option value="entertainment">Medical</option>
        <option value="entertainment">Groceries</option>
      </select>
    </div>

    <div class="form-group form-group-description">
        <label for="description">Description:</label>
        <textarea id="description" name="description" rows="4"></textarea>
    </div>
        <div class="form-group form-group-actions">
    <button type="submit">Add Expense</button>
    </div>
  </form>
  </div>

  <!-- Script to default date field to today on form load -->
  <script>
    window.addEventListener('DOMContentLoaded', function() {
      const dateInput = document.getElementById('date');

      // Only set default if date field is empty (Create mode, not Edit mode)
      if (dateInput && !dateInput.value) {
        // Get today's date in yyyy-MM-dd format
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        const formattedDate = `${year}-${month}-${day}`;

        // Set the default value
        dateInput.value = formattedDate;

        // Optional: Log for analytics/debugging
        console.log('Default date set to:', formattedDate);
      }
    });
  </script>
